# ==============================================================================
# Optional / Alternative Local Development Stack
# Note: Primary development flow uses Serverless PostgreSQL (Neon / Supabase).
# If you prefer running PostgreSQL locally, use this Docker Compose configuration.
# ==============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docsfeed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docsfeed
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d docsfeed']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
